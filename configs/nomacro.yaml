experiment:
  name: experimento_VGA_nomacro agreeableness O - O
  scenario: vga_purchase
  max_turns: 5
  use_system_reminder: true
context:
  preset: "estagflacao"
  macro_context_enabled: false
models:
  agent_1:
    provider: NVIDIA
    name: google/gemma-4-31b-it
    temperature: 0.5
    max_tokens: 2048
    persona:
      agreeableness: negative
      #neuroticism: positive
      #extraversion: negative
      #openness: negative
      #conscientiousness: positive
    tactics:
      anchoring: disable
      loss_aversion: enabled
      conditional_concession: enabled
      value_creation: enabled
      clarity: enabled
      fact_justification: enabled
    utility:
      p_target: 490
      p_floor: 460
  agent_2:
    provider: gemini
    name: gemma-4-26b-a4b-it
    temperature: 0.5
    max_tokens: 2048
    persona:
      agreeableness: negative
      #neuroticism: positive
      #extraversion: negative
      #openness: negative
      #conscientiousness: negative
    tactics:
      anchoring: disable
      loss_aversion: enabled
      conditional_concession: enabled
      value_creation: enabled
      #clarity: enabled
      #fact_justification: enabled
    utility:
      p_target: 470
      p_floor: 500
  judge:
    provider: groq
    name: openai/gpt-oss-120b
    temperature: 0.0
    metrics:
    - agreeableness
    - neuroticism
    - extraversion
    - openness
    - conscientiousness
    - anchoring
    - loss_aversion
    - conditional_concession
    - value_creation
    - clarity
    - fact_justification
#"@cf/openai/gpt-oss-120b"cloudflare
# Guard policy (optional). Each leak category accepts:
#   block (default) = reject the turn, retry, abort after max_attempts
#   warn            = record the event but forward the utterance
#   off             = ignore the category
# invalid_output:
#   raise (default) = abort if a structured adapter never returns valid JSON
#   plain           = accept the plain-text reply if it passes the leak guard
guard:
  #prompt_labels: block      # Role:, Reference Value, CoT bullets, etc.
  #verbatim_spans: block     # copied private prompt text
  #self_disclosure: warn     # "my limit is...", "I can go up to..."
  invalid_output: plain     # never abort just because the reply was not JSON
  max_attempts: 3
