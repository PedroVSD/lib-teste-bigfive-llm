experiment:
  name: "teste_crise_brasil_2025"
  turn_delay_seconds: 30.0

# Define a pressão do mundo externo
context:
  enabled: true
  inflation: "HIGH"
  interest_rates: "VERY_HIGH"
  government: "INTERVENTIONIST"
  crises:
    - "ECONOMIC_RECESSION"
    - "POLITICAL_INSTABILITY"
  country: "Brazil"
  year: "2025"
  custom_conditions:

# Dá para adicionar o efeito âncora pela extra_instuctions acima
# E também dá para adicionar instruções separadas para cada agente
# As condições de necessidade, devem existir para ambos que negociam. inclusive podem ser distintas
# digo pode ter condição global para ambos
models:
  # CANDIDATO
  candidate:
    provider: "lmstudio"
    name: "google/gemma-4-e2b"
    persona:
      agreeableness: 5
      neuroticism: 2
      extra_instructions: "Você está desesperado por este emprego."
  # RECRUTADOR
  recruiter:
    provider: "lmstudio"
    name: "google/gemma-4-e2b"
    persona:
      agreeableness: 1
      extraversion: 5

  judge:
    provider: "lmstudio"
    name: "qwen/qwen3-vl-4b"
    metrics:
      - "agreeableness"
      - "anchoring"
      - "conditional_concession"
      - "value_creation"
      - "fact_justification"
