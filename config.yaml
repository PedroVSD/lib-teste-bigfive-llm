experiment:
  name: "teste_b2b_crise_brasil_2025"
  turn_delay_seconds: 30.0
  max_turns: 2
  scenario: "procurement_b2b"

# Define a pressão do mundo externo
context:
  enabled: true
  inflation: "HIGH"
  interest_rates: "VERY_HIGH"
  government: "INTERVENTIONIST"
  crises:
    - "ECONOMIC_RECESSION"
    - "POLITICAL_INSTABILITY"
  country: "Brazil"
  year: "2025"
  custom_conditions:

# Dá para adicionar o efeito âncora pela extra_instuctions acima
# E também dá para adicionar instruções separadas para cada agente
# As condições de necessidade, devem existir para ambos que negociam. inclusive podem ser distintas
# digo pode ter condição global para ambos
models:
  # CANDIDATO
  agent_1:
    provider: "lmstudio"
    name: "google/gemma-4-e2b"
    temperature: 0.7
    persona:
      agreeableness: 5
      neuroticism: 2
      extra_instructions: "Sua empresa (varejo) está sofrendo muito com a recessão. Você TEM que conseguir um desconto agressivo no software ou o projeto será cancelado. Jogue duro e não aceite a primeira oferta."
  # RECRUTADOR
  agent_2:
    provider: "lmstudio"
    name: "google/gemma-4-e2b"
    temperature: 0.7
    persona:
      agreeableness: 1
      extraversion: 5
      extra_instructions: "Você precisa bater sua meta de vendas do trimestre. Seja empático, tente construir relacionamento, mas use concessões condicionais: só diminua o preço se o cliente abrir mão de algo."

  judge:
    provider: "ollama"
    name: "gpt-oss:120b-cloud"
    temperature: 0.0
    metrics:
      - "agreeableness"
      - "anchoring"
      - "conditional_concession"
      - "value_creation"
      - "fact_justification"
