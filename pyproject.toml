[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-negotiation-analyst"
version = "0.1.0"
description = "Analyze Big Five personality expression in LLM negotiations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "google-generativeai>=0.8.6",
    "httpx>=0.27",          # Ollama adapter + general HTTP
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
openai     = ["openai>=1.30"]
anthropic  = ["anthropic>=0.30"]
gemini     = ["google-genai>=0.1.0"]
analysis   = ["pandas>=2.0", "numpy>=1.26"]
all        = [
    "openai>=1.30",
    "anthropic>=0.30",
    "google-genai>=0.1.0",
    "pandas>=2.0",
    "numpy>=1.26",
]
dev        = ["pytest>=8", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["llm_negotiation_analyst/tests"]

[tool.setuptools.packages.find]
include = ["llm_negotiation_analyst*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
# Garante que uv sempre cria um venv isolado — nunca instala no sistema
managed = true


# ---------------------------------------------------------------------------
# uv — gerenciador de pacotes e ambientes virtuais
# Documentação: https://docs.astral.sh/uv
#
# Comandos rápidos:
#   uv sync                        instala dependências base
#   uv sync --extra openai         + suporte OpenAI
#   uv sync --extra all            + todos os extras
#   uv sync --extra dev            + ferramentas de dev (pytest)
#   uv run pytest                  roda testes sem ativar venv manualmente
#   uv run python meu_script.py    roda qualquer script no ambiente gerenciado
# ---------------------------------------------------------------------------
